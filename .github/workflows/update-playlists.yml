name: Actualizar playlists de musica y fondos

# Corre solo cuando cambia algo dentro de music/ o backgrounds/ (subir,
# borrar o renombrar archivos), sin importar la rama. Regenera
# music/playlist.json y backgrounds/playlist.json y los commitea de
# vuelta, asi no hace falta correr los scripts a mano despues de subir
# archivos por la web de GitHub.
on:
  push:
    paths:
      - "music/**"
      - "backgrounds/**"
      - "!music/playlist.json"
      - "!backgrounds/playlist.json"
  workflow_dispatch: {} # permite correrlo a mano desde la pestaña Actions

permissions:
  contents: write

jobs:
  update-playlists:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Regenerar playlist.json (musica y fondos)
        run: |
          python3 scripts/generate_playlist.py
          python3 scripts/generate_backgrounds_playlist.py

      - name: Commitear si hubo cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add music/playlist.json backgrounds/playlist.json
          if git diff --cached --quiet; then
            echo "Sin cambios en las playlists, nada que commitear."
          else
            git commit -m "Auto-actualizar playlist de musica/fondos"
            git push origin HEAD:${{ github.ref_name }}
          fi
