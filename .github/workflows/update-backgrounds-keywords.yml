name: Actualizar fondos desde Pexels por keywords

# Trae fotos gratuitas de Pexels (ver scripts/generate_backgrounds_from_keywords.py
# para la lista de keywords) y las agrega a backgrounds/external.json,
# sin tocar las entradas cargadas a mano (ej. un video de sponsor).
# Requiere el secret PEXELS_API_KEY (Settings -> Secrets and variables
# -> Actions -> New repository secret) con una API key gratuita de
# https://www.pexels.com/api/. Sin ese secret, el script no hace nada.
#
# Nota: el trigger "schedule" de GitHub Actions solo corre sobre la
# rama por defecto del repo. Tambien se puede disparar a mano con
# "Run workflow" en la pestaña Actions (workflow_dispatch, abajo).
on:
  schedule:
    - cron: "0 6 * * *" # una vez por dia
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-backgrounds-keywords:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Buscar fotos en Pexels y actualizar backgrounds/external.json
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: python3 scripts/generate_backgrounds_from_keywords.py

      - name: Commitear si hubo cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backgrounds/external.json
          if git diff --cached --quiet; then
            echo "Sin cambios en los fondos de Pexels."
          else
            git commit -m "Auto-actualizar fondos desde Pexels por keywords"
            git push origin HEAD:${{ github.ref_name }}
          fi
